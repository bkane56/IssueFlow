server:
  port: 8080

spring:
  application:
    name: issueflow
  datasource:
    url: jdbc:sqlite:data/issueflow.db
    driver-class-name: org.sqlite.JDBC
  jpa:
    database-platform: org.hibernate.community.dialect.SQLiteDialect
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: method
  api-docs:
    path: /v3/api-docs

issueflow:
  outbound:
    max-attempts: 5
    backoff-seconds:
      - 5
      - 15
      - 45
      - 120
    stale-processing-timeout-seconds: 30
    retry-after-max-seconds: 120
    worker:
      interval-ms: 2000
      enabled: true
    simulation:
      mode: FAIL_ONCE_THEN_SUCCEED
